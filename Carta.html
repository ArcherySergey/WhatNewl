<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CS2 Maps — Все 10 карт</title>
  <link rel="stylesheet" href="Carta2.css">
</head>
<body>

  <header class="header">
    <h1>CS2 <span>ALL MAPS</span></h1>
    <p>Наведите курсор на оранжевые точки на схеме</p>
    <div class="legend">
      <span><i class="b-ct"></i> Спавн CT</span>
      <span><i class="b-t"></i> Спавн T</span>
      <span><i class="b-site"></i> Плент / Цель</span>
    </div>
  </header>

  <main id="app" class="container"></main>

  <script>
    const maps = [
      {
        title: "1. DE_MIRAGE",
        w: "15,15,22,70|15,15,60,18|15,67,65,18|42,33,16,34|58,42,27,25",
        s: "A,20,66,14,16|B,18,16,14,16",
        ct: "19,48", t: "81,54",
        p: "27,74,Плент A (Тетрис/Джангл)|50,50,Мид|48,24,Окно/Шорт|25,24,Плент B (Ковры)|55,76,Яма/Палас",
        b: "Окно (CT): контроль мида и помощь на оба плента.|Джангл (CT): закрывает яму, палас и коннектор.|Тетрис (T): лучшее укрытие после закладки на А."
      },
      {
        title: "2. DE_DUST2",
        w: "16,15,16,60|16,58,68,17|68,15,16,60|44,18,14,40|44,18,24,15|42,75,18,14",
        s: "A,70,17,13,16|B,17,17,13,16",
        ct: "55,25", t: "51,83",
        p: "76,25,Плент A (Гусар)|76,52,Длина (Long A)|51,42,Мид и Зигзаг|23,25,Плент B и Тёмка",
        b: "Гусар (CT): лучший угол на А для приема длины и зиги.|Окно / Танцпол (CT): прием выхода из тёмки на B.|Яма на длине (T): сильный контроль бомбы под длину."
      },
      {
        title: "3. DE_INFERNO",
        w: "12,62,32,18|32,20,14,45|32,15,48,16|44,55,38,22|68,31,14,25",
        s: "A,68,57,13,17|B,34,16,14,15",
        ct: "75,23", t: "17,71",
        p: "41,23,Плент B (Гробы)|39,44,Банан|74,65,Плент A (Пески)|52,66,Мид и Ковры",
        b: "Пески (CT): закрывает ковры и шорт с укрытием.|Гробы на B (CT): позиция снайпера для защиты банана.|Балкон (T): отрезает перетяжку спецназа на А."
      },
      {
        title: "4. DE_NUKE",
        w: "12,42,26,16|36,22,32,56|68,42,20,16|28,70,42,12",
        s: "A,45,27,14,16|B,45,52,14,16",
        ct: "82,50", t: "17,50",
        p: "52,35,Плент A (Верх)|52,60,Плент B (Низ)|48,76,Улица и Сикрет|63,35,Рампа",
        b: "Девятка (CT): обзор верхнего плента А и улицы.|Рампа (CT): не дает атаке спуститься на нижний B.|Сикрет (T): контроль нижнего этажа после улицы."
      },
      {
        title: "5. DE_ANCIENT",
        w: "18,16,64,16|18,16,16,54|66,16,16,54|43,32,14,42|18,70,64,15",
        s: "A,20,18,13,15|B,67,18,13,15",
        ct: "50,24", t: "50,78",
        p: "26,25,Плент A (Храм)|50,50,Мид и Пончик|73,25,Плент B (Пещера)",
        b: "Пончик (CT): связывает мид и плент А.|Пещера (CT): удерживает выход с рампы на B.|Храм на А (T): надежное укрытие для защиты бомбы."
      },
      {
        title: "6. DE_ANUBIS",
        w: "20,16,60,15|20,16,15,50|65,16,15,50|44,31,12,44|20,66,60,16",
        s: "A,66,17,13,15|B,21,17,13,15",
        ct: "50,23", t: "50,74",
        p: "72,24,Плент A (Хэвен)|50,48,Мид и Вода|27,24,Плент B (Стрит)",
        b: "Хэвен на А (CT): возвышенность с обзором мейна и воды.|Коннектор (T): захват с воды открывает заход на B.|Стрит (T): лучшие укрытия для защиты бомбы на B."
      },
      {
        title: "7. DE_VERTIGO",
        w: "22,16,16,64|22,16,38,16|44,32,16,34|44,50,34,30|22,66,38,14",
        s: "A,64,52,13,16|B,23,17,14,15",
        ct: "52,24", t: "30,73",
        p: "70,60,Плент A (Рампа)|52,48,Мид и Лифты|30,24,Плент B (Лестница)",
        b: "Мешки на А (CT): укрытие против подъема с рампы.|Белая на B (CT): угол против подъема по лестнице.|Жёлтый на А (T): контроль бомбы на краю плента."
      },
      {
        title: "8. DE_OVERPASS",
        w: "38,14,24,26|22,40,18,35|58,40,20,35|22,68,56,16|40,42,18,14",
        s: "A,43,16,14,15|B,61,45,14,16",
        ct: "50,22", t: "50,76",
        p: "50,23,Плент A (Банк)|68,53,Плент B (Вода/Монстр)|31,55,Фонтан и Лонг А",
        b: "Девятка на B (CT): контроль монстра, воды и шорта.|Банк (CT): укрытие против выхода с туалетов.|Коннектор (T): быстрая смена атаки с B на A."
      },
      {
        title: "9. DE_TRAIN",
        w: "15,18,70,26|15,56,70,26|28,44,14,12|58,44,14,12",
        s: "A,44,22,15,18|B,44,60,15,18",
        ct: "78,31", t: "21,69",
        p: "51,31,Плент A (Поезда)|51,69,Плент B (Рампа)|28,31,Т-Мейн и Айви",
        b: "Айви / Зелень (CT): снайперский прострел на А.|Верх на B (CT): контроль обоих выходов с рампы.|Поп-дог (T): быстрый прорыв в центр плента А."
      },
      {
        title: "10. CS_OFFICE",
        w: "18,16,64,24|18,40,16,42|66,40,16,42|18,66,64,16",
        s: "H1,22,20,16,16|H2,62,20,16,16",
        ct: "50,74", t: "50,28",
        p: "30,28,Проектор (Цель 1)|70,28,Бумаги (Цель 2)|26,58,Лонг (Коридор)",
        b: "Бумаги (T): узкие проходы держатся дробовиками.|Снег / Двор (CT): контроль выходов из гаража."
      }
    ];

    const app = document.getElementById("app");

    maps.forEach(m => {
      const walls = m.w.split("|").map(item => {
        const [x, y, w, h] = item.split(",");
        return `<div class="wall" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`;
      }).join("");

      const sites = m.s.split("|").map(item => {
        const [txt, x, y, w, h] = item.split(",");
        return `<div class="site" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${txt}</div>`;
      }).join("");

      const pins = m.p.split("|").map(item => {
        const [x, y, txt] = item.split(",");
        return `<div class="pin" style="left:${x}%;top:${y}%"><span>${txt}</span></div>`;
      }).join("");

      const best = m.b.split("|").map(txt => {
        return `<div class="best-item">${txt}</div>`;
      }).join("");

      const [cx, cy] = m.ct.split(",");
      const [tx, ty] = m.t.split(",");

      app.innerHTML += `
        <section class="map-card">
          <h2>${m.title}</h2>
          <div class="grid">
            <div class="radar">
              ${walls}
              ${sites}
              <div class="spawn ct" style="left:${cx}%;top:${cy}%">CT</div>
              <div class="spawn t" style="left:${tx}%;top:${ty}%">T</div>
              ${pins}
            </div>
            <div class="info">
              <h3>Лучшие позиции:</h3>
              ${best}
            </div>
          </div>
        </section>
      `;
    });
  </script>

</body>
</html>
